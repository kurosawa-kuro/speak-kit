# 表現の教材。書き方は data/README.md。key と code は一度決めたら変えない。
- key: REQUEST_COULD_YOU
  code: P1-025
  form: Could you {verb_phrase}?
  meaning: 相手に丁寧に行動を依頼する
  intent: REQUEST
  tier: CORE
  kind: pattern
  example:
    en: Could you send me the file?
    ja: ファイルを送ってもらえますか？
  contrast_drill: true
  extra_examples:
    - key: REQ-001
      en: Could you send me the file?
      ja: ファイルを送ってもらえますか？
      difficulty: 1
      rubric: controlled-recall-v1
    - key: REQ-002
      en: Could you check this part?
      ja: この部分を確認してもらえますか？
      difficulty: 1
      rubric: controlled-recall-v1
    - key: REQ-003
      en: Could you explain that again?
      ja: もう一度説明してもらえますか？
      rubric: controlled-recall-v1
  quiz:
    meaning:
      near:
        - ファイルを送ってもいいですか？
        - ファイルを送りましたか？
        - ファイルを送るつもりですか？
    intent:
      correct: Could you ...?
      near:
        - Could I ...?
        - Would you like to ...?
        - Did you ...?
    form:
      near:
        - Could I send you the file?
        - Did you send me the file?
        - Would you like to send me the file?
  status: active
