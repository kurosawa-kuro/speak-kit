# 表現の教材。書き方は data/README.md。key と code は一度決めたら変えない。
- key: TIME_EXPERIENCE_HAVE_BEEN
  code: P1-023
  form: I have been to {place}.
  meaning: 訪問経験を述べる
  intent: EXPERIENCE
  tier: CORE
  kind: pattern
  example:
    en: I've been to Kyoto.
    ja: 京都に行ったことがある。
  contrast_drill: true
  quiz:
    meaning:
      near:
        - 京都に行く予定だ。
        - 京都に住んでいる。
        - 京都に行ったことはある？
    intent:
      correct: I have been to ...
      near:
        - Have you ever ...?
        - I ... yesterday.
        - I am going to ...
    form:
      near:
        - I went to Kyoto.
        - I've gone to Kyoto.
        - I'm going to Kyoto.
  status: active
