        - I'm watching movies.
        - I like watch movies.
  status: active
- key: REASON_BECAUSE
  code: P1-004
  form: "{result} because {reason}."
  meaning: 理由を添えて述べる
  intent: REASON
  tier: CORE
  kind: pattern
  example:
    en: I'm tired because I worked all night.
    ja: 一晩中作業したので疲れています。
  quiz:
    meaning:
      near:
        - 疲れているので一晩中作業しました。
        - 一晩中作業したが疲れていません。
        - 疲れたので一晩中休みました。
    intent:
      correct: ... because ...
      near:
        - That's why ...
        - Why ...?
        - In my case, ...
    form:
      near:
        - I worked all night because I'm tired.
        - I'm tired. That's why I worked all night.
        - I'm tired so I worked all night.
  status: active
